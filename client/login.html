<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardust | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-system-tag" aria-hidden="true">
            STCL-2.4 // AUTH GATE
        </div>

        <div class="login-logo">
            ✦
        </div>

        <div class="login-title">
            STARDUST
        </div>

        <div class="login-subtitle">
            MILITARY SYSTEM
        </div>

        <div class="login-divider"></div>

        <p class="login-description">
            Sign in to access the Stardust Command Network.
        </p>

        <input
            id="countryCode"
            class="country-code"
            list="countryCodesList"
            type="text"
            maxlength="32"
            autocomplete="off"
            aria-label="Country code"
            placeholder="COUNTRY CODE">

        <datalist id="countryCodesList"></datalist>

        <button
            id="discordLogin"
            class="discord-login">
            <span>◈</span>
            LOGIN WITH DISCORD
        </button>

        <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>

        <div class="login-authfoot">

            <div class="login-footer">
                STARDUST COMMAND NETWORK
            </div>

            <a
                class="coffee-link"
                href="https://buymeacoffee.com/space0141"
                target="_blank"
                rel="noopener">
                ☕ BUY ME A COFFEE
            </a>

        </div>

    </div>

</div>

<script src="config.js"></script>
<script src="login.js"></script>
<script src="/security.js"></script>

</body>
</html>
