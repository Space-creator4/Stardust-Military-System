<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardust | Map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css"
    >

    <script>
        window.CESIUM_BASE_URL =
            "https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/";
    </script>

    <script
        src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js">
    </script>

    <style>
        body {
            font-family: var(--font-body);
        }

        .map-page {
            width: 100%;
            height: 100%;
            padding: 28px;
            background: transparent;
        }

        .map-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .map-title {
            color: #e7eef6;
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 6px;
        }

        .map-subtitle {
            margin-top: 7px;
            color: #8a99a8;
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 3.5px;
            text-transform: uppercase;
        }

        .map-status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 12px;
            border: 1px solid rgba(148, 184, 255, 0.12);
            border-radius: 999px;
            background: rgba(10, 15, 21, 0.5);
            color: #8a99a8;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .map-status .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #5ee6a0;
            box-shadow: 0 0 9px rgba(94, 230, 160, 0.45);
        }

        .force-filter-chip {
            padding: 5px 11px;
            border: 1px solid rgba(217, 196, 122, 0.45);
            background: rgba(217, 196, 122, 0.07);
            color: #d9c47a;
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(217, 196, 122, 0.12);
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }

        .force-filter-chip:hover {
            color: #f3e3a8;
            border-color: #d9c47a;
            background: rgba(217, 196, 122, 0.12);
            box-shadow: 0 0 16px rgba(217, 196, 122, 0.18);
        }

        .map-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 126px);
            margin-top: 20px;
            overflow: hidden;
            border: 1px solid rgba(148, 184, 255, 0.1);
            background: radial-gradient(760px 500px at 52% 44%, rgba(26, 40, 64, 0.32), rgba(5, 8, 12, 0.95) 74%);
            border-radius: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 22px 48px -28px rgba(0, 0, 0, 0.9);
        }

        .map-container::before,
        .map-container::after {
            content: "";
            position: absolute;
            z-index: 12;
            width: 18px;
            height: 18px;
            border: 0 solid rgba(76, 201, 240, 0.4);
            pointer-events: none;
        }

        .map-container::before {
            left: 12px;
            top: 12px;
            border-left-width: 1px;
            border-top-width: 1px;
        }

        .map-container::after {
            right: 12px;
            bottom: 12px;
            border-right-width: 1px;
            border-bottom-width: 1px;
        }

        #mapGlobe {
            width: 100%;
            height: 100%;
        }

        .map-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            width: 220px;
            border: 1px solid rgba(148, 184, 255, 0.1);
            background: linear-gradient(180deg, rgba(12, 18, 25, 0.86), rgba(7, 11, 16, 0.92));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 40px -20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .overlay-title {
            height: 42px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid rgba(148, 184, 255, 0.1);
            color: #8a99a8;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .map-control {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border: 0;
            border-left: 2px solid transparent;
            border-bottom: 1px solid rgba(148, 184, 255, 0.1);
            background: transparent;
            color: #8a99a8;
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-align: left;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .map-control:last-child {
            border-bottom: 0;
        }

        .map-control:hover {
            background: rgba(28, 40, 52, 0.45);
            color: #e7eef6;
        }

        .map-control.active {
            color: #e7eef6;
            border-left-color: #5ee6a0;
            background: linear-gradient(90deg, rgba(94, 230, 160, 0.1), transparent 70%);
        }

        .map-control:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .map-control:focus-visible,
        .force-filter-chip:focus-visible {
            outline: 2px solid rgba(76, 201, 240, 0.75);
            outline-offset: 2px;
        }

        .map-info {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            width: 230px;
            border: 1px solid rgba(148, 184, 255, 0.1);
            background: linear-gradient(180deg, rgba(12, 18, 25, 0.86), rgba(7, 11, 16, 0.92));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 18px 40px -20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .map-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 15px;
            border-bottom: 1px solid rgba(148, 184, 255, 0.1);
        }

        .map-info-row:last-child {
            border-bottom: 0;
        }

        .map-info-row span:first-child {
            color: #5b6c7a;
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .map-info-row span:last-child {
            color: #e7eef6;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.4px;
        }

        .cesium-viewer-bottom {
            left: 12px !important;
            bottom: 6px !important;
        }

        .cesium-widget-credits {
            font-size: 9px;
            color: rgba(138, 153, 168, 0.45) !important;
            background: transparent !important;
        }

        .cesium-widget-credits a {
            color: rgba(138, 153, 168, 0.5) !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .force-filter-chip,
            .map-control {
                transition: none;
            }
        }

        @media (max-width: 700px) {
            .map-page {
                padding: 15px;
            }

            .map-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .map-container {
                height: calc(100vh - 160px);
            }

            .map-overlay {
                width: 180px;
            }

            .map-info {
                display: none;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header>

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <div>
                <h1>STARDUST</h1>
                <span>MILITARY SYSTEM</span>
            </div>

        </div>

        <div class="system-status" id="systemStatus">

            <span class="status-dot"></span>

            <span id="systemStatusText">
                CONNECTING...
            </span>

        </div>

    </header>

    <main>

        <aside class="sidebar">

            <div class="sidebar-section">

                <div class="sidebar-label">
                    COMMAND
                </div>

                <a href="/" class="nav">
                    <span class="nav-icon">◉</span>
                    <span>COMMAND</span>
                </a>

                <a href="/map.html" class="nav active">
                    <span class="nav-icon">◎</span>
                    <span>MAP</span>
                </a>

                <a href="/force.html" class="nav">
                    <span class="nav-icon">⚔</span>
                    <span>FORCES</span>
                </a>

                <a href="/order.html" class="nav">
                    <span class="nav-icon">▤</span>
                    <span>ORDERS</span>
                </a>

                <a href="/chat.html" class="nav">
                    <span class="nav-icon">◌</span>
                    <span>CHAT</span>
                </a>

            </div>

            <div class="sidebar-bottom">

                <a href="/settings.html" class="nav">
                    <span class="nav-icon">⚙</span>
                    <span>SETTINGS</span>
                </a>

                <a href="/admin.html" class="nav admin">
                    <span class="nav-icon">◆</span>
                    <span>ADMIN CONSOLE</span>
                </a>

                <a href="https://buymeacoffee.com/space0141" class="nav coffee" target="_blank" rel="noopener">
                    <span class="nav-icon">☕</span>
                    <span>BUY ME A COFFEE</span>
                </a>

                <a href="/auth/logout" class="nav logout">
                    <span class="nav-icon">←</span>
                    <span>LOGOUT</span>
                </a>

            </div>

        </aside>

        <section class="content">

            <div class="map-page">

                <div class="map-header">

                    <div>
                        <div class="map-title">
                            MAP
                        </div>

                        <div class="map-subtitle">
                            GLOBAL OPERATIONS MAP
                        </div>
                    </div>

                    <div class="map-status">

                        <span class="status-dot"></span>

                        <span id="mapStatusText">
                            INITIALIZING MAP
                        </span>

                        <span
                            class="force-filter-chip"
                            id="forceFilterChip"
                            style="display: none">
                        </span>

                    </div>

                </div>

                <div class="map-container">

                    <div id="mapGlobe" role="img" aria-label="Global operations map"></div>

                    <div class="map-overlay" role="group" aria-label="Map controls">

                        <div class="overlay-title">
                            MAP CONTROLS
                        </div>

                        <button
                            class="map-control"
                            id="homeMap">
                            RESET VIEW
                        </button>

                        <button
                            class="map-control"
                            id="zoomIn">
                            ZOOM IN
                        </button>

                        <button
                            class="map-control"
                            id="zoomOut">
                            ZOOM OUT
                        </button>

                        <button
                            class="map-control active"
                            id="toggleBorders">
                            COUNTRY BORDERS: ON
                        </button>

                        <button
                            class="map-control active"
                            id="buildingsToggle">
                            3D BUILDINGS: LOADING
                        </button>

                    </div>

                    <div class="map-info" role="group" aria-label="Cursor readout">

                        <div class="map-info-row">
                            <span>CURSOR LATITUDE</span>
                            <span id="latitude">--</span>
                        </div>

                        <div class="map-info-row">
                            <span>CURSOR LONGITUDE</span>
                            <span id="longitude">--</span>
                        </div>

                        <div class="map-info-row">
                            <span>ACTIVE MARKERS</span>
                            <span id="activeMarkers">0</span>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>
<script src="/config.js"></script>
<script src="/userdata.js"></script>
<script src="/renderer.js"></script>
<script src="/security.js"></script>

</body>
</html>
