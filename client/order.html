<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardust | Orders</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .orders-page {
            width: 100%;
            min-height: 100%;
            padding: 28px;
            background: #05070a;
        }

        .orders-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #1c252d;
        }

        .orders-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 5px;
        }

        .orders-subtitle {
            margin-top: 6px;
            color: #697781;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .orders-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #697781;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .orders-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d16262;
            box-shadow: 0 0 9px rgba(98, 209, 139, 0.45);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 12px;
            margin-top: 20px;
        }

        .panel {
            border: 1px solid #1c252d;
            background: #080b0f;
        }

        .panel-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #1c252d;
            color: #aeb8bf;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .panel-indicator {
            color: #62d18b;
            font-size: 7px;
            letter-spacing: 1.5px;
        }

        .orders-list {
            min-height: 420px;
        }

        .order {
            padding: 17px 18px;
            border-bottom: 1px solid #151d23;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .order:hover {
            background: #0d1217;
        }

        .order.active {
            background: #0d1217;
            border-left: 2px solid #62d18b;
        }

        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .order-id {
            color: #dbe3e8;
            font-family: "Courier New", monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .order-status {
            padding: 4px 7px;
            border: 1px solid #304139;
            color: #62d18b;
            font-size: 6px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .order-status.pending {
            color: #d5b866;
            border-color: #514a31;
        }

        .order-status.completed {
            color: #697781;
            border-color: #30383e;
        }

        .order-name {
            margin-top: 8px;
            color: #aeb8bf;
            font-size: 10px;
            font-weight: 600;
        }

        .order-description {
            margin-top: 5px;
            color: #56636e;
            font-size: 8px;
            line-height: 1.5;
        }

        .order-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            color: #3f4a52;
            font-family: "Courier New", monospace;
            font-size: 7px;
        }

        .order-creator {
            color: #56636e;
            font-family: "Courier New", monospace;
            font-size: 7px;
            margin-top: 8px;
        }

        .create-form {
            padding: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #56636e;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #1c252d;
            outline: none;
            background: #06090c;
            color: #c8d1d6;
            font-family: inherit;
            font-size: 8px;
        }

        .form-input,
        .form-select {
            height: 38px;
            padding: 0 10px;
        }

        .form-textarea {
            min-height: 100px;
            padding: 10px;
            resize: vertical;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #394850;
        }

        .create-button {
            width: 100%;
            height: 40px;
            border: 1px solid #304139;
            background: #0d1511;
            color: #62d18b;
            font-family: inherit;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .create-button:hover {
            background: #121d16;
        }

        .order-details {
            margin-top: 12px;
            padding: 18px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail {
            padding: 12px;
            border: 1px solid #151d23;
            background: #06090c;
        }

        .detail-label {
            color: #3f4a52;
            font-size: 6px;
            letter-spacing: 1.5px;
        }

        .detail-value {
            margin-top: 7px;
            color: #aeb8bf;
            font-family: "Courier New", monospace;
            font-size: 9px;
        }

        .empty-orders {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f4a52;
            font-size: 8px;
            letter-spacing: 2px;
        }

        .message {
            margin-top: 12px;
            padding: 12px 15px;
            border: 1px solid #1c252d;
            background: #080b0f;
            color: #697781;
            font-size: 8px;
        }

        .action-button {
            width: 100%;
            height: 40px;
            margin-top: 10px;
            border: 1px solid #30383e;
            background: #0a0d10;
            color: #9ca8b0;
            font-family: inherit;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .action-button:hover {
            background: #12171b;
            color: #ffffff;
        }

        .action-button.complete {
            border-color: #304139;
            color: #62d18b;
        }

        .action-button.complete:hover {
            background: #121d16;
        }

        .action-button.danger {
            border-color: #513232;
            color: #d16262;
        }

        .action-button.danger:hover {
            background: #1a1010;
        }

        @media (max-width: 1000px) {
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .orders-page {
                padding: 15px;
            }

            .orders-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header>

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <div>
                <h1>STARDUST</h1>
                <span>MILITARY SYSTEM</span>
            </div>

        </div>

        <div class="system-status">

            <span
                class="status-dot"
                id="systemDot">
            </span>

            <span id="systemStatusText">
                CONNECTING...
            </span>

        </div>

    </header>

    <main>

        <aside class="sidebar">

            <div class="sidebar-section">

                <div class="sidebar-label">
                    COMMAND
                </div>

                <a href="/" class="nav">
                    <span class="nav-icon">◉</span>
                    <span>COMMAND</span>
                </a>

                <a href="/map.html" class="nav">
                    <span class="nav-icon">◎</span>
                    <span>MAP</span>
                </a>

                <a href="/force.html" class="nav">
                    <span class="nav-icon">⚔</span>
                    <span>FORCES</span>
                </a>

                <a href="/order.html" class="nav active">
                    <span class="nav-icon">▤</span>
                    <span>ORDERS</span>
                </a>

                <a href="/chat.html" class="nav">
                    <span class="nav-icon">◌</span>
                    <span>CHAT</span>
                </a>

            </div>

            <div class="sidebar-bottom">

                <a href="/settings.html" class="nav">
                    <span class="nav-icon">⚙</span>
                    <span>SETTINGS</span>
                </a>

                <a href="/admin.html" class="nav admin">
                    <span class="nav-icon">◆</span>
                    <span>ADMIN CONSOLE</span>
                </a>

                <a href="/auth/logout" class="nav logout">
                    <span class="nav-icon">←</span>
                    <span>LOGOUT</span>
                </a>

            </div>

        </aside>

        <section class="content">

            <div class="orders-page">

                <div class="orders-header">

                    <div>

                        <div class="orders-title">
                            ORDERS
                        </div>

                        <div class="orders-subtitle">
                            COMMAND ORDER NETWORK
                        </div>

                    </div>

                    <div class="orders-status">

                        <span
                            class="orders-status-dot"
                            id="ordersStatusDot">
                        </span>

                        <span id="ordersConnection">
                            CONNECTING
                        </span>

                    </div>

                </div>

                <div class="orders-grid">

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                COMMAND ORDERS
                            </span>

                            <span
                                class="panel-indicator"
                                id="orderCount">
                                0 ORDERS
                            </span>

                        </div>

                        <div
                            class="orders-list"
                            id="ordersList">

                            <div class="empty-orders">
                                NO ACTIVE ORDERS
                            </div>

                        </div>

                    </div>

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                CREATE ORDER
                            </span>

                            <span class="panel-indicator">
                                COMMAND
                            </span>

                        </div>

                        <div class="create-form">

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER NAME
                                </label>

                                <input
                                    class="form-input"
                                    id="orderName"
                                    maxlength="80"
                                    placeholder="ENTER ORDER NAME"
                                >

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER TYPE
                                </label>

                                <select
                                    class="form-select"
                                    id="orderType">

                                    <option value="ground">
                                        GROUND
                                    </option>

                                    <option value="naval">
                                        NAVAL
                                    </option>

                                    <option value="air">
                                        AIR
                                    </option>

                                    <option value="movement">
                                        MOVEMENT
                                    </option>

                                    <option value="exercise">
                                        EXERCISE
                                    </option>

                                </select>

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    PRIORITY
                                </label>

                                <select
                                    class="form-select"
                                    id="orderPriority">

                                    <option value="routine">
                                        ROUTINE
                                    </option>

                                    <option value="priority">
                                        PRIORITY
                                    </option>

                                    <option value="urgent">
                                        URGENT
                                    </option>

                                </select>

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER DETAILS
                                </label>

                                <textarea
                                    class="form-textarea"
                                    id="orderDescription"
                                    maxlength="2000"
                                    placeholder="ENTER ORDER DETAILS">
                                </textarea>

                            </div>

                            <button
                                class="create-button"
                                id="createOrder">
                                CREATE ORDER
                            </button>

                            <div
                                class="message"
                                id="formMessage"
                                style="display:none;">
                            </div>

                        </div>

                    </div>

                </div>

                <div
                    class="panel order-details"
                    id="orderDetails"
                    style="display:none;">

                    <div class="panel-header">

                        <span>
                            ORDER DETAILS
                        </span>

                        <span
                            class="panel-indicator"
                            id="selectedOrderStatus">
                            ACTIVE
                        </span>

                    </div>

                    <div class="detail-grid">

                        <div class="detail">

                            <div class="detail-label">
                                ORDER ID
                            </div>

                            <div
                                class="detail-value"
                                id="detailId">
                                —
                            </div>

                        </div>

                        <div class="detail">

                            <div class="detail-label">
                                TYPE
                            </div>

                            <div
                                class="detail-value"
                                id="detailType">
                                —
                            </div>

                        </div>

                        <div class="detail">

                            <div class="detail-label">
                                PRIORITY
                            </div>

                            <div
                                class="detail-value"
                                id="detailPriority">
                                —
                            </div>

                        </div>

                    </div>

                    <div
                        class="message"
                        id="detailDescription">
                    </div>

                    <div
                        class="message"
                        id="detailCreator">
                    </div>

                    <div class="detail-actions">

                        <button
                            class="action-button complete"
                            id="toggleOrderStatus">
                            MARK COMPLETE
                        </button>

                        <button
                            class="action-button danger"
                            id="deleteOrder">
                            DELETE ORDER
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="/security.js"></script>

<script>

let orders = [];
let selectedOrder = null;
let currentUser = null;
let socket = null;
let reconnectTimer = null;
let manuallyClosed = false;

function getElement(id) {
    return document.getElementById(id);
}

function setSystemStatus(online) {

    const text =
        getElement("systemStatusText");

    const connection =
        getElement("ordersConnection");

    const dot =
        getElement("systemDot");

    const ordersDot =
        getElement("ordersStatusDot");

    if (online) {

        if (text) {
            text.textContent = "SYSTEM ONLINE";
        }

        if (connection) {
            connection.textContent = "ONLINE";
        }

        if (dot) {
            dot.style.background = "#62d18b";
        }

        if (ordersDot) {
            ordersDot.style.background = "#62d18b";
        }

    } else {

        if (text) {
            text.textContent = "SYSTEM OFFLINE";
        }

        if (connection) {
            connection.textContent = "OFFLINE";
        }

        if (dot) {
            dot.style.background = "#d16262";
        }

        if (ordersDot) {
            ordersDot.style.background = "#d16262";
        }
    }
}

function showFormMessage(message) {

    const element =
        getElement("formMessage");

    if (!element) {
        return;
    }

    element.textContent = message;
    element.style.display = "block";
}

function hideFormMessage() {

    const element =
        getElement("formMessage");

    if (element) {
        element.style.display = "none";
    }
}

function formatTime(timestamp) {

    if (!timestamp) {
        return "—";
    }

    return new Date(timestamp).toLocaleString();
}

function renderOrders() {

    const container =
        getElement("ordersList");

    const count =
        getElement("orderCount");

    if (count) {
        count.textContent =
            `${orders.length} ORDERS`;
    }

    if (!container) {
        return;
    }

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty-orders">
                NO ACTIVE ORDERS
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    for (const order of orders) {

        const element =
            document.createElement("div");

        element.className = "order";

        if (
            selectedOrder &&
            selectedOrder.id === order.id
        ) {
            element.classList.add("active");
        }

        const top = document.createElement("div");
        top.className = "order-top";

        const id = document.createElement("div");
        id.className = "order-id";
        id.textContent = order.id;

        const status = document.createElement("div");
        status.className = "order-status";

        if (order.status === "COMPLETED") {
            status.classList.add("completed");
        }

        status.textContent = order.status;

        const name = document.createElement("div");
        name.className = "order-name";
        name.textContent = order.name;

        const description = document.createElement("div");
        description.className = "order-description";
        description.textContent = order.description;

        const meta = document.createElement("div");
        meta.className = "order-meta";
        meta.textContent =
            `${order.type.toUpperCase()}  •  ${order.priority.toUpperCase()}  •  ${formatTime(order.createdAt)}`;

        const creator = document.createElement("div");
        creator.className = "order-creator";
        creator.textContent = order.createdBy
            ? `ISSUED BY ${order.createdBy.username.toUpperCase()}`
            : "ISSUED BY COMMAND";

        top.appendChild(id);
        top.appendChild(status);

        element.appendChild(top);
        element.appendChild(name);
        element.appendChild(description);
        element.appendChild(meta);
        element.appendChild(creator);

        element.addEventListener("click", () => {
            selectOrder(order);
        });

        container.appendChild(element);
    }
}

function selectOrder(order) {

    selectedOrder = order;

    const details = getElement("orderDetails");

    if (details) {
        details.style.display = "block";
    }

    getElement("detailId").textContent = order.id;
    getElement("detailType").textContent = order.type.toUpperCase();
    getElement("detailPriority").textContent = order.priority.toUpperCase();
    getElement("selectedOrderStatus").textContent = order.status.toUpperCase();
    getElement("detailDescription").textContent = order.description;

    const creator = getElement("detailCreator");

    if (creator) {
        creator.textContent = order.createdBy
            ? `ISSUED BY ${order.createdBy.username.toUpperCase()} at ${formatTime(order.createdAt)}`
            : `ISSUED BY COMMAND at ${formatTime(order.createdAt)}`;
    }

    const toggle = getElement("toggleOrderStatus");

    if (toggle) {
        toggle.textContent =
            order.status === "COMPLETED"
                ? "REOPEN ORDER"
                : "MARK COMPLETE";
    }

    renderOrders();
}

function createOrder() {

    const name =
        getElement("orderName").value.trim();

    const type =
        getElement("orderType").value;

    const priority =
        getElement("orderPriority").value;

    const description =
        getElement("orderDescription").value.trim();

    if (!name) {
        showFormMessage("ORDER NAME IS REQUIRED.");
        return;
    }

    if (!description) {
        showFormMessage("ORDER DETAILS ARE REQUIRED.");
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_create",
        order: {
            name,
            type,
            priority,
            description
        }
    }));

    getElement("orderName").value = "";
    getElement("orderDescription").value = "";
    hideFormMessage();
}

function toggleSelectedOrderStatus() {

    if (!selectedOrder) {
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_update",
        id: selectedOrder.id,
        order: {
            status: selectedOrder.status === "COMPLETED" ? "ACTIVE" : "COMPLETED"
        }
    }));
}

function deleteSelectedOrder() {

    if (!selectedOrder) {
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_delete",
        id: selectedOrder.id
    }));

    selectedOrder = null;

    const details = getElement("orderDetails");

    if (details) {
        details.style.display = "none";
    }
}

async function loadCurrentUser() {

    try {

        const response = await fetch("/api/me", {
            credentials: "include"
        });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return false;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.authenticated || !data.user) {
            window.location.href = "/login.html";
            return false;
        }

        currentUser = data.user;
        return true;

    } catch (error) {

        console.error("Failed to load user:", error);
        return false;
    }
}

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss"
            : "ws";

    setSystemStatus(false);

    socket = new WebSocket(`${protocol}://${window.location.host}`);

    socket.addEventListener("open", () => {

        setSystemStatus(true);

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
    });

    socket.addEventListener("close", event => {

        setSystemStatus(false);

        if (manuallyClosed) {
            return;
        }

        if (event.code === 4001) {
            window.location.href = "/login.html";
            return;
        }

        if (event.code === 4003) {
            window.location.href = "/login.html";
            return;
        }

        reconnectTimer =
            setTimeout(connectWebSocket, 3000);
    });

    socket.addEventListener("error", error => {

        console.error("WebSocket error:", error);
        setSystemStatus(false);
    });

    socket.addEventListener("message", event => {

        try {

            const data = JSON.parse(event.data);

            if (data.type === "orders") {

                orders = Array.isArray(data.orders)
                    ? data.orders
                    : [];

                if (
                    selectedOrder &&
                    !orders.some(order => order.id === selectedOrder.id)
                ) {
                    selectedOrder = null;

                    const details = getElement("orderDetails");

                    if (details) {
                        details.style.display = "none";
                    }
                }

                renderOrders();
                return;
            }

            if (data.type === "order_created") {

                if (
                    selectedOrder &&
                    data.order &&
                    selectedOrder.id === data.order.id
                ) {
                    selectOrder(data.order);
                }

                return;
            }

            if (data.type === "server_status") {
                return;
            }

            if (
                data.type === "error"
            ) {
                showFormMessage(data.message);
                return;
            }

        } catch (error) {
            console.error("Invalid server message:", error);
        }
    });
}

getElement("createOrder").addEventListener("click", createOrder);

const toggleButton = getElement("toggleOrderStatus");

if (toggleButton) {
    toggleButton.addEventListener("click", toggleSelectedOrderStatus);
}

const deleteButton = getElement("deleteOrder");

if (deleteButton) {
    deleteButton.addEventListener("click", deleteSelectedOrder);
}

loadCurrentUser().then(authed => {
    if (authed) {
        connectWebSocket();
    }
});

</script>

</body>
</html>
