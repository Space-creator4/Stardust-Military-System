<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardust | Orders</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

    <style>
        :root {
            --bg: #0d0a1a;
            --bg-2: #150f24;
            --plate-a: rgba(34, 28, 65, 0.78);
            --plate-b: rgba(13, 10, 26, 0.92);
            --line: rgba(150, 140, 220, 0.14);
            --line-2: rgba(150, 140, 220, 0.28);
            --text: #e9e4f5;
            --text-2: #b3a9d9;
            --text-3: #7c74a8;
            --blue: #6e8cff;
            --violet: #9e7cff;
            --lavender: #c9a8ff;
            --hazard: #ff5f9e;
            --hazard-2: #ff8ac0;
            --radius-panel: 8px;
            --radius-control: 4px;
            --font-stencil: "Black Ops One", "Stardos Stencil", "Rajdhani", "Segoe UI", sans-serif;
            --font-display: "Rajdhani", "Segoe UI", system-ui, sans-serif;
            --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
            --font-mono: "Courier New", Courier, ui-monospace, monospace;
            --shadow-panel: 0 24px 50px -28px rgba(0, 0, 0, 0.85);
            --hl-top: inset 0 1px 0 rgba(235, 230, 255, 0.06);
            --green: #6e8cff;
            --cyan: #9e7cff;
            --red: #ff5f9e;
            --gold: #c9a8ff;
            --surface-1: var(--plate-a);
            --surface-2: var(--plate-b);
        }

        body {
            font-family: var(--font-body);
        }

        .orders-page {
            width: 100%;
            min-height: 100%;
            padding: 28px;
            background: transparent;
        }

        .orders-header {
            position: relative;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .orders-header::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 180px;
            height: 4px;
            background: repeating-linear-gradient(45deg, rgba(255, 95, 160, 0.5) 0 5px, transparent 5px 10px);
            opacity: 0.55;
            pointer-events: none;
        }

        .orders-title {
            margin: 0;
            color: var(--text);
            font-family: var(--font-stencil);
            font-size: 26px;
            letter-spacing: 5px;
        }

        .orders-subtitle {
            margin-top: 7px;
            color: var(--text-3);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 3.5px;
            text-transform: uppercase;
        }

        .orders-status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 6px 12px;
            border: 1px solid rgba(110, 140, 255, 0.4);
            border-radius: 999px;
            background: linear-gradient(180deg, var(--plate-a), var(--plate-b));
            color: var(--text);
            box-shadow: var(--hl-top), 0 0 12px rgba(110, 140, 255, 0.07);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .orders-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--hazard);
            box-shadow: 0 0 9px rgba(255, 95, 160, 0.4);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            margin-top: 20px;
        }

        .panel {
            position: relative;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, var(--plate-a), var(--plate-b));
            border-radius: var(--radius-panel);
            box-shadow: var(--hl-top), var(--shadow-panel);
        }

        .panel::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 8px;
            width: 9px;
            height: 9px;
            border-left: 1px solid rgba(110, 140, 255, 0.5);
            border-top: 1px solid rgba(110, 140, 255, 0.5);
            pointer-events: none;
        }

        .panel::after {
            content: "";
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 9px;
            height: 9px;
            border-right: 1px solid rgba(110, 140, 255, 0.5);
            border-bottom: 1px solid rgba(110, 140, 255, 0.5);
            pointer-events: none;
        }

        .panel-header {
            position: relative;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--line);
            color: var(--text-2);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .panel-header::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 3px;
            height: 16px;
            transform: translateY(-50%);
            background: rgba(110, 140, 255, 0.55);
        }

        .panel-indicator {
            color: var(--blue);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .orders-list {
            min-height: 420px;
            contain: content;
            background: rgba(0, 0, 0, 0.14);
        }

        .order {
            position: relative;
            padding: 17px 18px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .order:hover {
            background: linear-gradient(90deg, rgba(110, 140, 255, 0.05), transparent 60%);
        }

        .order.active {
            background: linear-gradient(90deg, rgba(110, 140, 255, 0.1), transparent 60%);
            border-left: 2px solid var(--blue);
        }

        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .order-id {
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .order-status {
            padding: 4px 9px;
            border: 1px solid rgba(110, 140, 255, 0.4);
            background: rgba(110, 140, 255, 0.08);
            color: var(--blue);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 999px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .order-status.pending {
            color: var(--lavender);
            border-color: rgba(205, 168, 255, 0.35);
            background: rgba(205, 168, 255, 0.06);
        }

        .order-status.completed {
            color: var(--text-3);
            border-color: var(--line-2);
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .order-priority {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border: 1px solid var(--line-2);
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-3);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .order-priority.high,
        .order-priority.urgent {
            color: var(--blue);
            border-color: rgba(110, 140, 255, 0.45);
        }

        .order-priority.critical {
            color: var(--hazard-2);
            border-color: rgba(255, 95, 160, 0.5);
        }

        .order-priority.routine {
            color: var(--text-3);
        }

        .order-name {
            margin-top: 8px;
            color: var(--text);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .order-description {
            margin-top: 5px;
            color: var(--text-2);
            font-size: 10px;
            line-height: 1.55;
        }

        .order-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            color: var(--text-3);
            font-family: var(--font-mono);
            font-size: 9px;
        }

        .order-creator {
            color: var(--text-2);
            font-family: var(--font-mono);
            font-size: 9px;
            margin-top: 8px;
        }

        .order-country {
            color: var(--violet);
        }

        .create-form {
            padding: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-3);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--line-2);
            outline: none;
            background: rgba(0, 0, 0, 0.28);
            color: var(--text);
            font-family: inherit;
            font-size: 11px;
            border-radius: var(--radius-control);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .form-input,
        .form-select {
            height: 38px;
            padding: 0 10px;
        }

        .form-textarea {
            min-height: 100px;
            padding: 10px;
            resize: vertical;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: rgba(110, 140, 255, 0.6);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45), 0 0 0 2px rgba(110, 140, 255, 0.12);
        }

        .form-input:focus-visible,
        .form-select:focus-visible,
        .form-textarea:focus-visible {
            outline: 2px solid rgba(158, 122, 255, 0.55);
            outline-offset: 2px;
        }

        #app .create-button {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(110, 140, 255, 0.55);
            background: linear-gradient(180deg, rgba(30, 24, 58, 0.55), rgba(12, 9, 25, 0.85));
            color: var(--blue);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius-control);
            box-shadow: var(--hl-top), 0 0 14px rgba(110, 140, 255, 0.1);
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        #app .create-button:hover {
            border-color: rgba(110, 140, 255, 0.8);
            color: #d7cfff;
            box-shadow: 0 0 18px rgba(110, 140, 255, 0.2);
        }

        #app .create-button:focus-visible {
            outline: 2px solid rgba(110, 140, 255, 0.75);
            outline-offset: 2px;
        }

        .order-details {
            margin-top: 12px;
            padding: 18px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail {
            padding: 12px;
            border: 1px solid var(--line);
            background: rgba(0, 0, 0, 0.22);
            border-radius: var(--radius-control);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .detail-label {
            color: var(--text-3);
            font-family: var(--font-display);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .detail-value {
            margin-top: 7px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 10px;
        }

        .empty-orders {
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .message {
            margin-top: 12px;
            padding: 12px 15px;
            border: 1px solid var(--line-2);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-2);
            font-family: var(--font-mono);
            font-size: 10px;
            border-radius: var(--radius-control);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .detail-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        #app .action-button {
            width: 100%;
            height: 40px;
            margin-top: 10px;
            border: 1px solid var(--line-2);
            background: linear-gradient(180deg, var(--plate-a), var(--plate-b));
            color: var(--text-2);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: var(--radius-control);
            box-shadow: var(--hl-top);
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        #app .action-button:hover {
            background: linear-gradient(180deg, rgba(30, 24, 58, 0.7), rgba(12, 9, 25, 0.9));
            border-color: rgba(158, 122, 255, 0.5);
            color: var(--text);
        }

        #app .action-button:focus-visible {
            outline: 2px solid rgba(158, 122, 255, 0.55);
            outline-offset: 2px;
        }

        #app .action-button.complete {
            border-color: rgba(110, 140, 255, 0.4);
            color: var(--blue);
        }

        #app .action-button.complete:hover {
            background: rgba(110, 140, 255, 0.08);
            border-color: var(--blue);
            box-shadow: 0 0 14px rgba(110, 140, 255, 0.14);
        }

        #app .action-button.danger {
            border-color: rgba(255, 95, 160, 0.4);
            color: var(--hazard-2);
        }

        #app .action-button.danger:hover {
            background: rgba(255, 95, 160, 0.1);
            border-color: rgba(255, 95, 160, 0.7);
            box-shadow: 0 0 14px rgba(255, 95, 160, 0.14);
        }

        @media (prefers-reduced-motion: reduce) {
            .order,
            .create-button,
            .action-button {
                transition: none;
            }
        }

        @media (max-width: 1000px) {
            .orders-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .orders-page {
                padding: 15px;
            }

            .orders-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }

            .orders-status {
                display: none;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header>

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <div>
                <h1>STARDUST</h1>
                <span>MILITARY SYSTEM</span>
            </div>

        </div>

        <div class="system-status">

            <span
                class="status-dot"
                id="systemDot">
            </span>

            <span id="systemStatusText">
                CONNECTING...
            </span>

        </div>

    </header>

    <main>

        <aside class="sidebar">

            <div class="sidebar-section">

                <div class="sidebar-label">
                    COMMAND
                </div>

                <a href="/" class="nav">
                    <span class="nav-icon">◉</span>
                    <span>COMMAND</span>
                </a>

                <a href="/map.html" class="nav">
                    <span class="nav-icon">◎</span>
                    <span>MAP</span>
                </a>

                <a href="/force.html" class="nav">
                    <span class="nav-icon">⚔</span>
                    <span>FORCES</span>
                </a>

                <a href="/order.html" class="nav active">
                    <span class="nav-icon">▤</span>
                    <span>ORDERS</span>
                </a>

                <a href="/chat.html" class="nav">
                    <span class="nav-icon">◌</span>
                    <span>CHAT</span>
                </a>

            </div>

            <div class="sidebar-bottom">

                <a href="/settings.html" class="nav">
                    <span class="nav-icon">⚙</span>
                    <span>SETTINGS</span>
                </a>

                <a href="/admin.html" class="nav admin">
                    <span class="nav-icon">◆</span>
                    <span>ADMIN CONSOLE</span>
                </a>

                <a href="https://buymeacoffee.com/space0141" class="nav coffee" target="_blank" rel="noopener">
                    <span class="nav-icon">☕</span>
                    <span>BUY ME A COFFEE</span>
                </a>

                <a href="/auth/logout" class="nav logout">
                    <span class="nav-icon">←</span>
                    <span>LOGOUT</span>
                </a>

            </div>

        </aside>

        <section class="content">

            <div class="orders-page">

                <div class="orders-header">

                    <div>

                        <div class="orders-title">
                            ORDERS
                        </div>

                        <div class="orders-subtitle">
                            COMMAND ORDER NETWORK
                        </div>

                    </div>

                    <div class="orders-status">

                        <span
                            class="orders-status-dot"
                            id="ordersStatusDot">
                        </span>

                        <span id="ordersConnection">
                            CONNECTING
                        </span>

                    </div>

                </div>

                <div class="orders-grid">

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                COMMAND ORDERS
                            </span>

                            <span
                                class="panel-indicator"
                                id="orderCount">
                                0 ORDERS
                            </span>

                        </div>

                        <div
                            class="orders-list"
                            id="ordersList">

                            <div class="empty-orders">
                                NO ACTIVE ORDERS
                            </div>

                        </div>

                    </div>

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                CREATE ORDER
                            </span>

                            <span class="panel-indicator">
                                COMMAND
                            </span>

                        </div>

                        <div class="create-form">

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER NAME
                                </label>

                                <input
                                    class="form-input"
                                    id="orderName"
                                    maxlength="80"
                                    aria-label="Order name"
                                    placeholder="ENTER ORDER NAME"
                                >

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER TYPE
                                </label>

                                <select
                                    class="form-select"
                                    id="orderType"
                                    aria-label="Order type">

                                    <option value="ground">
                                        GROUND
                                    </option>

                                    <option value="naval">
                                        NAVAL
                                    </option>

                                    <option value="air">
                                        AIR
                                    </option>

                                    <option value="movement">
                                        MOVEMENT
                                    </option>

                                    <option value="exercise">
                                        EXERCISE
                                    </option>

                                </select>

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    PRIORITY
                                </label>

                                <select
                                    class="form-select"
                                    id="orderPriority">

                                    <option value="routine">
                                        ROUTINE
                                    </option>

                                    <option value="priority">
                                        PRIORITY
                                    </option>

                                    <option value="urgent">
                                        URGENT
                                    </option>

                                </select>

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    ORDER DETAILS
                                </label>

                                <textarea
                                    class="form-textarea"
                                    id="orderDescription"
                                    maxlength="2000"
                                    aria-label="Order details"
                                    placeholder="ENTER ORDER DETAILS">
                                </textarea>

                            </div>

                            <button
                                class="create-button"
                                id="createOrder"
                                aria-label="Create order">
                                CREATE ORDER
                            </button>

                            <div
                                class="message"
                                id="formMessage"
                                role="status"
                                aria-live="polite"
                                style="display:none;">
                            </div>

                        </div>

                    </div>

                </div>

                <div
                    class="panel order-details"
                    id="orderDetails"
                    aria-live="polite"
                    style="display:none;">

                    <div class="panel-header">

                        <span>
                            ORDER DETAILS
                        </span>

                        <span
                            class="panel-indicator"
                            id="selectedOrderStatus">
                            ACTIVE
                        </span>

                    </div>

                    <div class="detail-grid">

                        <div class="detail">

                            <div class="detail-label">
                                ORDER ID
                            </div>

                            <div
                                class="detail-value"
                                id="detailId">
                                —
                            </div>

                        </div>

                        <div class="detail">

                            <div class="detail-label">
                                TYPE
                            </div>

                            <div
                                class="detail-value"
                                id="detailType">
                                —
                            </div>

                        </div>

                        <div class="detail">

                            <div class="detail-label">
                                PRIORITY
                            </div>

                            <div
                                class="detail-value"
                                id="detailPriority">
                                —
                            </div>

                        </div>

                    </div>

                    <div
                        class="message"
                        id="detailDescription">
                    </div>

                    <div
                        class="message"
                        id="detailCreator">
                    </div>

                    <div class="detail-actions">

                        <button
                            class="action-button complete"
                            id="toggleOrderStatus">
                            MARK COMPLETE
                        </button>

                        <button
                            class="action-button danger"
                            id="deleteOrder">
                            DELETE ORDER
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="/config.js"></script>
<script src="/security.js"></script>

<script>

let orders = [];
let selectedOrder = null;
let currentUser = null;
let socket = null;
let reconnectTimer = null;
let reconnectDelay = 1000;
let reconnectResetTimer = null;
let manuallyClosed = false;

function getElement(id) {
    return document.getElementById(id);
}

function setSystemStatus(online) {

    const text =
        getElement("systemStatusText");

    const connection =
        getElement("ordersConnection");

    const dot =
        getElement("systemDot");

    const ordersDot =
        getElement("ordersStatusDot");

    if (online) {

        if (text) {
            text.textContent = "SYSTEM ONLINE";
        }

        if (connection) {
            connection.textContent = "ONLINE";
        }

        if (dot) {
            dot.style.background = "#6e8cff";
        }

        if (ordersDot) {
            ordersDot.style.background = "#6e8cff";
        }

    } else {

        if (text) {
            text.textContent = "SYSTEM OFFLINE";
        }

        if (connection) {
            connection.textContent = "OFFLINE";
        }

        if (dot) {
            dot.style.background = "#ff5f9e";
        }

        if (ordersDot) {
            ordersDot.style.background = "#ff5f9e";
        }
    }
}

function showFormMessage(message) {

    const element =
        getElement("formMessage");

    if (!element) {
        return;
    }

    element.textContent = message;
    element.style.display = "block";
}

function hideFormMessage() {

    const element =
        getElement("formMessage");

    if (element) {
        element.style.display = "none";
    }
}

function formatTime(timestamp) {

    if (!timestamp) {
        return "—";
    }

    return new Date(timestamp).toLocaleString();
}

function renderOrders() {

    const container =
        getElement("ordersList");

    const count =
        getElement("orderCount");

    if (count) {
        count.textContent =
            `${orders.length} ORDERS`;
    }

    if (!container) {
        return;
    }

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty-orders">
                NO ACTIVE ORDERS
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    for (const order of orders) {

        const element =
            document.createElement("div");

        element.className = "order";

        if (
            selectedOrder &&
            selectedOrder.id === order.id
        ) {
            element.classList.add("active");
        }

        const top = document.createElement("div");
        top.className = "order-top";

        const id = document.createElement("div");
        id.className = "order-id";
        id.textContent = order.id;

        const status = document.createElement("div");
        status.className = "order-status";

        if (order.status === "COMPLETED") {
            status.classList.add("completed");
        }

        status.textContent = order.status;

        const name = document.createElement("div");
        name.className = "order-name";
        name.textContent = order.name;

        const description = document.createElement("div");
        description.className = "order-description";
        description.textContent = order.description;

        const meta = document.createElement("div");
        meta.className = "order-meta";
        meta.textContent =
            `${order.type.toUpperCase()}  •  ${order.priority.toUpperCase()}  •  ${formatTime(order.createdAt)}`;

        const creator = document.createElement("div");
        creator.className = "order-creator";
        creator.textContent = order.createdBy
            ? `ISSUED BY ${order.createdBy.username.toUpperCase()}`
            : "ISSUED BY COMMAND";

        top.appendChild(id);
        top.appendChild(status);

        element.appendChild(top);
        element.appendChild(name);
        element.appendChild(description);
        element.appendChild(meta);
        element.appendChild(creator);

        element.addEventListener("click", () => {
            selectOrder(order);
        });

        container.appendChild(element);
    }
}

let ordersRenderQueued = false;

function scheduleRenderOrders() {
    if (ordersRenderQueued) {
        return;
    }

    ordersRenderQueued = true;

    requestAnimationFrame(() => {
        ordersRenderQueued = false;
        renderOrders();
    });
}

function selectOrder(order) {

    selectedOrder = order;

    const details = getElement("orderDetails");

    if (details) {
        details.style.display = "block";
    }

    getElement("detailId").textContent = order.id;
    getElement("detailType").textContent = order.type.toUpperCase();
    getElement("detailPriority").textContent = order.priority.toUpperCase();
    getElement("selectedOrderStatus").textContent = order.status.toUpperCase();
    getElement("detailDescription").textContent = order.description;

    const creator = getElement("detailCreator");

    if (creator) {
        creator.textContent = order.createdBy
            ? `ISSUED BY ${order.createdBy.username.toUpperCase()} at ${formatTime(order.createdAt)}`
            : `ISSUED BY COMMAND at ${formatTime(order.createdAt)}`;
    }

    const toggle = getElement("toggleOrderStatus");

    if (toggle) {
        toggle.textContent =
            order.status === "COMPLETED"
                ? "REOPEN ORDER"
                : "MARK COMPLETE";
    }

    renderOrders();
}

function createOrder() {

    const name =
        getElement("orderName").value.trim();

    const type =
        getElement("orderType").value;

    const priority =
        getElement("orderPriority").value;

    const description =
        getElement("orderDescription").value.trim();

    if (!name) {
        showFormMessage("ORDER NAME IS REQUIRED.");
        return;
    }

    if (!description) {
        showFormMessage("ORDER DETAILS ARE REQUIRED.");
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_create",
        order: {
            name,
            type,
            priority,
            description
        }
    }));

    getElement("orderName").value = "";
    getElement("orderDescription").value = "";
    hideFormMessage();
}

function toggleSelectedOrderStatus() {

    if (!selectedOrder) {
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_update",
        id: selectedOrder.id,
        order: {
            status: selectedOrder.status === "COMPLETED" ? "ACTIVE" : "COMPLETED"
        }
    }));
}

function deleteSelectedOrder() {

    if (!selectedOrder) {
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        showFormMessage("NOT CONNECTED TO THE COMMAND NETWORK.");
        return;
    }

    socket.send(JSON.stringify({
        type: "orders_delete",
        id: selectedOrder.id
    }));

    selectedOrder = null;

    const details = getElement("orderDetails");

    if (details) {
        details.style.display = "none";
    }
}

async function loadCurrentUser() {

    try {

        const response = await fetch(window.stardustApi("/api/me"), {
            credentials: "include"
        });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return false;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.authenticated || !data.user) {
            window.location.href = "/login.html";
            return false;
        }

        currentUser = data.user;
        return true;

    } catch (error) {

        console.error("Failed to load user:", error);
        return false;
    }
}

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    const protocol =
        location.protocol === "https:"
            ? "wss"
            : "ws";

    setSystemStatus(false);

    socket = new WebSocket(window.stardustWsUrl());

    socket.addEventListener("open", () => {

        setSystemStatus(true);

        if (reconnectResetTimer) {
            clearTimeout(reconnectResetTimer);
        }

        reconnectResetTimer = setTimeout(() => {
            reconnectResetTimer = null;
            reconnectDelay = 1000;
        }, 10000);

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
    });

    socket.addEventListener("close", event => {

        setSystemStatus(false);

        if (manuallyClosed) {
            return;
        }

        if (event.code === 4001) {
            window.location.href = "/login.html";
            return;
        }

        if (event.code === 4003) {
            window.location.href = "/login.html";
            return;
        }

        if (event.code === 4004) {
            console.warn(
                "Another session connected; auto-reconnect disabled."
            );
            return;
        }

        reconnectTimer =
            setTimeout(() => {
                reconnectTimer = null;
                connectWebSocket();
                reconnectDelay = Math.min(
                    reconnectDelay * 2,
                    30000
                );
            }, reconnectDelay);
    });

    socket.addEventListener("error", error => {

        console.error("WebSocket error:", error);
        setSystemStatus(false);
    });

    socket.addEventListener("message", event => {

        try {

            const data = JSON.parse(event.data);

            if (data.type === "orders") {

                orders = Array.isArray(data.orders)
                    ? data.orders
                    : [];

                if (
                    selectedOrder &&
                    !orders.some(order => order.id === selectedOrder.id)
                ) {
                    selectedOrder = null;

                    const details = getElement("orderDetails");

                    if (details) {
                        details.style.display = "none";
                    }
                }

                scheduleRenderOrders();
                return;
            }

            if (data.type === "order_created") {

                if (
                    selectedOrder &&
                    data.order &&
                    selectedOrder.id === data.order.id
                ) {
                    selectOrder(data.order);
                }

                return;
            }

            if (data.type === "server_status") {
                return;
            }

            if (
                data.type === "error"
            ) {
                showFormMessage(data.message);
                return;
            }

        } catch (error) {
            console.error("Invalid server message:", error);
        }
    });
}

getElement("createOrder").addEventListener("click", createOrder);

const toggleButton = getElement("toggleOrderStatus");

if (toggleButton) {
    toggleButton.addEventListener("click", toggleSelectedOrderStatus);
}

const deleteButton = getElement("deleteOrder");

if (deleteButton) {
    deleteButton.addEventListener("click", deleteSelectedOrder);
}

loadCurrentUser().then(authed => {
    if (authed) {
        connectWebSocket();
    }
});

</script>
