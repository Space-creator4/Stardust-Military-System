<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardust | System Update</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@500;600;700&family=Stardos+Stencil:wght@400;700&display=swap"
        rel="stylesheet"
    >

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #0e110b;
        --bg-2: #15190f;
        --plate-a: rgba(28, 33, 19, 0.78);
        --plate-b: rgba(11, 13, 7, 0.92);
        --line: rgba(214, 204, 158, 0.14);
        --line-2: rgba(214, 204, 158, 0.28);
        --text: #e8e2cc;
        --text-2: #aaa37f;
        --text-3: #6f6b54;
        --olive: #a3b04c;
        --sand: #cdb878;
        --amber: #c9a35f;
        --hazard: #e06b2a;
        --radius-panel: 8px;
        --radius-control: 4px;
        --font-stencil: "Black Ops One", "Stardos Stencil", "Rajdhani", "Segoe UI", sans-serif;
        --font-display: "Rajdhani", "Segoe UI", system-ui, sans-serif;
        --hl-top: inset 0 1px 0 rgba(232, 226, 204, 0.06);
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-display);
        overflow: hidden;
    }

    .background {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(1000px 520px at 12% -8%, rgba(163, 176, 76, 0.05), transparent 60%),
            radial-gradient(900px 620px at 104% 4%, rgba(205, 184, 120, 0.04), transparent 55%),
            radial-gradient(1200px 800px at 50% 120%, rgba(163, 176, 76, 0.045), transparent 60%),
            linear-gradient(rgba(214, 204, 158, 0.022) 1px, transparent 1px),
            linear-gradient(90deg, rgba(214, 204, 158, 0.022) 1px, transparent 1px);
        background-size: auto, auto, auto, 44px 44px, 44px 44px;
        z-index: -1;
    }

    .container {
        position: relative;
        width: 90%;
        max-width: 620px;
        text-align: center;
        padding: 55px 40px;
        background: linear-gradient(180deg, var(--plate-a), var(--plate-b));
        border: 1px solid var(--line);
        border-radius: var(--radius-panel);
        box-shadow: var(--hl-top), 0 24px 50px -28px rgba(0, 0, 0, 0.85);
    }

    .container::before,
    .container::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        border: 0 solid rgba(163, 176, 76, 0.45);
        pointer-events: none;
    }

    .container::before {
        left: 9px;
        top: 9px;
        border-left-width: 1px;
        border-top-width: 1px;
    }

    .container::after {
        right: 9px;
        bottom: 9px;
        border-right-width: 1px;
        border-bottom-width: 1px;
    }

    .status {
        display: inline-flex;
        align-items: center;
        padding: 7px 14px;
        margin-bottom: 22px;
        border-radius: var(--radius-control);
        border: 1px solid var(--line-2);
        background: linear-gradient(180deg, rgba(163, 176, 76, 0.08), transparent);
        color: var(--olive);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.5px;
        text-transform: uppercase;
    }

    h1 {
        font-family: var(--font-stencil);
        font-weight: 400;
        font-size: 30px;
        letter-spacing: 3px;
    }

    p {
        color: var(--text-2);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.7;
        max-width: 460px;
        margin: 0 auto;
    }

    .line {
        width: 140px;
        height: 2px;
        margin: 26px auto;
        background: repeating-linear-gradient(45deg, rgba(224, 107, 42, 0.4) 0 5px, transparent 5px 10px);
        opacity: 0.55;
    }

    .footer {
        margin-top: 34px;
        color: var(--text-3);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .pulse {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--olive);
        box-shadow: 0 0 9px rgba(163, 176, 76, 0.6);
        animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.35;
            transform: scale(0.8);
        }
    }
</style>

</head>

<body>

<div class="background"></div>

<main class="container">
    <div class="status">
        <span class="pulse"></span>
        System Maintenance
    </div>

    <h1>We'll Be Back Soon</h1>

    <div class="line"></div>

    <p>
        Stardust Military System is currently undergoing an update
        or scheduled maintenance.
    </p>

    <p style="margin-top: 12px;">
        Please check back shortly. The system will be available again
        once maintenance has been completed.
    </p>

    <div class="footer">
        STARDUST MILITARY SYSTEM
    </div>
</main>

</body>
</html>
