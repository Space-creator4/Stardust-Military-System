<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stardust | Settings</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .settings-page {
            width: 100%;
            min-height: 100%;
            padding: 28px;
            background: #05070a;
        }

        .settings-header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #1c252d;
        }

        .settings-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 5px;
        }

        .settings-subtitle {
            margin-top: 6px;
            color: #697781;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .settings-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #697781;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .settings-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d16262;
            box-shadow: 0 0 9px rgba(98, 209, 139, 0.45);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 12px;
            margin-top: 20px;
        }

        .panel {
            border: 1px solid #1c252d;
            background: #080b0f;
        }

        .panel-header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #1c252d;
            color: #aeb8bf;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .panel-indicator {
            color: #62d18b;
            font-size: 7px;
            letter-spacing: 1.5px;
        }

        .settings-form {
            padding: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #56636e;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #1c252d;
            outline: none;
            background: #06090c;
            color: #c8d1d6;
            font-family: inherit;
            font-size: 8px;
        }

        .form-input:focus {
            border-color: #394850;
        }

        .form-color {
            width: 100%;
            box-sizing: border-box;
            height: 38px;
            padding: 4px 6px;
            border: 1px solid #1c252d;
            outline: none;
            background: #06090c;
            cursor: pointer;
        }

        .save-button {
            width: 100%;
            height: 40px;
            border: 1px solid #304139;
            background: #0d1511;
            color: #62d18b;
            font-family: inherit;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .save-button:hover {
            background: #121d16;
        }

        .message {
            margin-top: 12px;
            padding: 12px 15px;
            border: 1px solid #1c252d;
            background: #080b0f;
            color: #697781;
            font-size: 8px;
            display: none;
        }

        .account-panel {
            padding: 18px;
        }

        .account-identity {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 15px;
            border-bottom: 1px solid #151d23;
        }

        .account-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #1c252d;
            background: #06090c;
            color: #3f4a52;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .account-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .account-name {
            color: #dbe3e8;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .account-meta {
            margin-top: 5px;
            color: #3f4a52;
            font-family: "Courier New", monospace;
            font-size: 7px;
        }

        .account-field {
            padding: 12px 0;
            border-bottom: 1px solid #151d23;
        }

        .account-field-label {
            color: #3f4a52;
            font-size: 6px;
            letter-spacing: 1.5px;
        }

        .account-field-value {
            margin-top: 6px;
            color: #aeb8bf;
            font-family: "Courier New", monospace;
            font-size: 9px;
        }

        @media (max-width: 1000px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .settings-page {
                padding: 15px;
            }

            .settings-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <header>

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <div>
                <h1>STARDUST</h1>
                <span>MILITARY SYSTEM</span>
            </div>

        </div>

        <div class="system-status">

            <span
                class="status-dot"
                id="systemDot">
            </span>

            <span id="systemStatusText">
                CONNECTING...
            </span>

        </div>

    </header>

    <main>

        <aside class="sidebar">

            <div class="sidebar-section">

                <div class="sidebar-label">
                    COMMAND
                </div>

                <a href="/" class="nav">
                    <span class="nav-icon">◉</span>
                    <span>COMMAND</span>
                </a>

                <a href="/map.html" class="nav">
                    <span class="nav-icon">◎</span>
                    <span>MAP</span>
                </a>

                <a href="/force.html" class="nav">
                    <span class="nav-icon">⚔</span>
                    <span>FORCES</span>
                </a>

                <a href="/order.html" class="nav">
                    <span class="nav-icon">▤</span>
                    <span>ORDERS</span>
                </a>

                <a href="/chat.html" class="nav">
                    <span class="nav-icon">◌</span>
                    <span>CHAT</span>
                </a>

            </div>

            <div class="sidebar-bottom">

                <a href="/settings.html" class="nav active">
                    <span class="nav-icon">⚙</span>
                    <span>SETTINGS</span>
                </a>

                <a href="/admin.html" class="nav admin">
                    <span class="nav-icon">◆</span>
                    <span>ADMIN CONSOLE</span>
                </a>

                <a href="/auth/logout" class="nav logout">
                    <span class="nav-icon">←</span>
                    <span>LOGOUT</span>
                </a>

            </div>

        </aside>

        <section class="content">

            <div class="settings-page">

                <div class="settings-header">

                    <div>

                        <div class="settings-title">
                            SETTINGS
                        </div>

                        <div class="settings-subtitle">
                            OPERATOR PROFILE CONFIGURATION
                        </div>

                    </div>

                    <div class="settings-status">

                        <span
                            class="settings-status-dot"
                            id="settingsStatusDot">
                        </span>

                        <span id="settingsConnection">
                            CONNECTING
                        </span>

                    </div>

                </div>

                <div class="settings-grid">

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                PROFILE SETTINGS
                            </span>

                            <span class="panel-indicator">
                                OPERATOR
                            </span>

                        </div>

                        <div class="settings-form">

                            <div class="form-group">

                                <label class="form-label">
                                    DISPLAY NAME
                                </label>

                                <input
                                    class="form-input"
                                    id="settingDisplayName"
                                    maxlength="32"
                                    placeholder="ENTER COMMAND NAME"
                                >

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    COUNTRY / FACTION
                                </label>

                                <input
                                    class="form-input"
                                    id="settingCountry"
                                    maxlength="60"
                                    placeholder="ENTER COUNTRY ASSIGNMENT"
                                >

                            </div>

                            <div class="form-group">

                                <label class="form-label">
                                    THEME COLOUR
                                </label>

                                <input
                                    type="color"
                                    class="form-color"
                                    id="settingThemeColor"
                                    value="#62d18b"
                                >

                            </div>

                            <button
                                class="save-button"
                                id="saveSettings">
                                SAVE SETTINGS
                            </button>

                            <div
                                class="message"
                                id="settingsMessage">
                            </div>

                        </div>

                    </div>

                    <div class="panel">

                        <div class="panel-header">

                            <span>
                                ACCOUNT
                            </span>

                            <span class="panel-indicator">
                                DISCORD
                            </span>

                        </div>

                        <div class="account-panel">

                            <div class="account-identity">

                                <div
                                    class="account-avatar"
                                    id="accountAvatar">
                                    —
                                </div>

                                <div>

                                    <div
                                        class="account-name"
                                        id="accountName">
                                        —
                                    </div>

                                    <div
                                        class="account-meta"
                                        id="accountHandle">
                                        — 
                                    </div>

                                </div>

                            </div>

                            <div class="account-field">

                                <div class="account-field-label">
                                    DISCORD ID
                                </div>

                                <div
                                    class="account-field-value"
                                    id="accountId">
                                    —
                                </div>

                            </div>

                            <div class="account-field">

                                <div class="account-field-label">
                                    ACCESS LEVEL
                                </div>

                                <div
                                    class="account-field-value"
                                    id="accountRole">
                                    —
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="/security.js"></script>

<script>

let currentUser = null;

function getElement(id) {
    return document.getElementById(id);
}

function setSystemStatus(online) {

    const text = getElement("systemStatusText");
    const connection = getElement("settingsConnection");
    const dot = getElement("systemDot");
    const settingsDot = getElement("settingsStatusDot");

    if (online) {

        if (text) {
            text.textContent = "SYSTEM ONLINE";
        }

        if (connection) {
            connection.textContent = "ONLINE";
        }

        if (dot) {
            dot.style.background = "#62d18b";
        }

        if (settingsDot) {
            settingsDot.style.background = "#62d18b";
        }

    } else {

        if (text) {
            text.textContent = "SYSTEM OFFLINE";
        }

        if (connection) {
            connection.textContent = "OFFLINE";
        }

        if (dot) {
            dot.style.background = "#d16262";
        }

        if (settingsDot) {
            settingsDot.style.background = "#d16262";
        }
    }
}

function showMessage(message, error) {

    const element = getElement("settingsMessage");

    if (!element) {
        return;
    }

    element.textContent = message;
    element.style.display = "block";
    element.style.color = error ? "#d16262" : "#697781";
}

function buildAvatar(user) {

    const container = getElement("accountAvatar");

    if (!container || !user) {
        return;
    }

    if (user.avatar) {

        const img = document.createElement("img");

        img.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
        img.onerror = () => {
            container.innerHTML = "✦";
        };

        container.innerHTML = "";
        container.appendChild(img);

    } else {
        container.innerHTML = "✦";
    }
}

function renderAccount(user) {

    if (!user) {
        return;
    }

    getElement("accountName").textContent =
        user.display_name ||
        user.global_name ||
        user.username ||
        "COMMANDER";

    getElement("accountHandle").textContent =
        user.username
            ? `@${user.username}`
            : "COMMANDER";

    getElement("accountId").textContent = user.id;
    getElement("accountRole").textContent =
        user.isAdmin ? "ADMINISTRATOR" : "OPERATOR";

    buildAvatar(user);
}

async function loadSettings() {

    try {

        const response = await fetch("/api/settings", {
            credentials: "include"
        });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.authenticated) {
            window.location.href = "/login.html";
            return;
        }

        const settings = data.settings || {};

        getElement("settingDisplayName").value =
            settings.display_name || "";

        getElement("settingCountry").value =
            settings.country || "";

        if (settings.theme_color) {
            getElement("settingThemeColor").value =
                settings.theme_color;
        }

    } catch (error) {

        console.error("Failed to load settings:", error);
        showMessage("UNABLE TO LOAD SETTINGS.", true);
    }
}

async function loadCurrentUser() {

    try {

        const response = await fetch("/api/me", {
            credentials: "include"
        });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.authenticated || !data.user) {
            window.location.href = "/login.html";
            return;
        }

        currentUser = data.user;
        renderAccount(currentUser);

        setSystemStatus(true);

    } catch (error) {

        console.error("Failed to load user:", error);
        setSystemStatus(false);
    }
}

async function saveSettings() {

    const displayName =
        getElement("settingDisplayName").value.trim();

    const country =
        getElement("settingCountry").value.trim();

    const themeColor =
        getElement("settingThemeColor").value;

    try {

        const response = await fetch("/api/settings", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                display_name: displayName,
                country: country,
                theme_color: themeColor
            })
        });

        if (response.status === 401) {
            window.location.href = "/login.html";
            return;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        showMessage("SETTINGS SAVED.");

        if (data.settings && data.settings.theme_color) {

            const dot = getElement("systemDot");

            if (dot) {
                dot.style.background = data.settings.theme_color;
            }
        }

        if (currentUser) {
            currentUser.display_name = displayName;
            currentUser.country = country;
            renderAccount(currentUser);
        }

    } catch (error) {

        console.error("Failed to save settings:", error);
        showMessage("UNABLE TO SAVE SETTINGS.", true);
    }
}

getElement("saveSettings").addEventListener("click", saveSettings);

loadCurrentUser();
loadSettings();

</script>

</body>
</html>
