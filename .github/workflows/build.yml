name: Build Distributions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.0.2)"
        required: false
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact: client/dist-win-0.0.1
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: client/dist-linux-0.0.1
            name: linux
          - os: macos-latest
            script: dist:mac
            artifact: client/dist-mac-0.0.1
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build ${{ matrix.name }}
        working-directory: client
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: dists

      - name: Determine release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage release files
        run: |
          mkdir -p release
          find dists \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" \
            -o -name "*.AppImage" -o -name "latest*.yml" \
            -o -name "*.blockmap" -o -name "*.blockmap.*" \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            Auto-generated distribution of Stardust Military System.

            **Assets**
            - Windows installer (`.exe`) + `.zip` archive
            - Linux `.AppImage`
            - macOS `.dmg`
            - Update manifests (`latest*.yml`) + differential blockmaps
          files: release/
          fail_on_unmatched_artifacts: true