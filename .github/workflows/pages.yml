name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Stage static client
        run: |
          mkdir -p _site
          cp -r client/. _site/
          rm -f _site/main.js
          rm -f _site/preload.js
          rm -f _site/package.json
          rm -f _site/package-lock.json
          echo "stardustn.co.uk" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: https://stardustn.co.uk

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4